# ============================================
# БАЗА ДАННЫХ POSTGRESQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/forest_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIBERNATE / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# ЗАГРУЗКА ФАЙЛОВ
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# НАСТРОЙКИ ПРИЛОЖЕНИЯ
# ============================================
forest.validation.min-area=0.01
forest.validation.tolerance=0.5

# ============================================
# THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# ЛОГИРОВАНИЕ
# ============================================
logging.level.com.alhrb.forestry=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.spatial=DEBUG
logging.level.org.springframework.transaction=DEBUG

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# Чтобы работала форма логина
server.error.whitelabel.enabled=false