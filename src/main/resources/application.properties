spring.application.name=forestry
# ============================================
# БАЗА ДАННЫХ POSTGRESQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/forest_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIBERNATE / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPGDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# ЗАГРУЗКА ФАЙЛОВ
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# НАСТРОЙКИ ПРИЛОЖЕНИЯ (ЛЕСНОЕ ХОЗЯЙСТВО)
# ============================================
forest.validation.min-area=0.01
forest.validation.tolerance=0.5

# ============================================
# ЛОГИРОВАНИЕ
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.alhrb.forestry=DEBUG

# ============================================
# THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# ВЕБ-НАСТРОЙКИ
# ============================================
server.port=8080
server.servlet.context-path=/
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
