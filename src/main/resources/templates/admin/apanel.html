<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}" xmlns="http://www.w3.org/1999/html"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<div th:fragment="content" xmlns:sec="http://www.w3.org/1999/xhtml">
    <h5>Администрирование</h5>
    <div id="adminPanelTabs">
        <ul class="uk-subnav uk-subnav-pill" uk-switcher>
            <li class="uk-active" sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">
                <a href="#" uk-tooltip="Менеджер пользователей">
                    <span class="uk-margin-small-right" uk-icon="icon: users"></span>Менеджер пользователей</a>
            </li>
            <li sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">
                <a href="#" uk-tooltip="Загрузка файлов">
                    <span class="uk-margin-small-right" uk-icon="icon: file-text"></span>Загрузка файлов</a>
            </li>
        </ul>
        <div class="uk-switcher uk-margin">
            <div sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">
                <div id="gridUsersFilter" class="uk-card uk-card-body">
                    <div class="uk-label" data-toggle="filter" data-target="#gridUsersFilterBody">
                        Фильтр<span class="filter-arrow">▲</span>
                    </div>
                    <div id="gridUsersFilterBody" class="uk-form-stacked uk-hidden">
                        <div id="usersFilterData" style="padding: 8px !important;">
                            <div class="card">
                                <div class="uk-grid uk-grid-small">
                                    <div>
                                        <label class="uk-form-label" id="lblUserLogin" for="userLogin">
                                            Логин
                                        </label>
                                        <input type="text" data-filter
                                               class="uk-form-controls uk-width-small"
                                               id="userLogin"/>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lblUserEmail" for="userEmail">
                                            Email
                                        </label>
                                        <input type="text" data-filter
                                               class="uk-form-controls uk-width-small"
                                               id="userEmail"/>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lbluserFullName"
                                               for="userFullName">
                                            Полное имя
                                        </label>
                                        <input type="text" data-filter
                                               class="uk-form-controls uk-width-medium"
                                               id="userFullName"/>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lblUserPhone"
                                               for="userPhone">
                                            Телефон
                                        </label>
                                        <input type="text" data-filter
                                               class="uk-form-controls uk-width-small"
                                               id="userPhone"/>
                                    </div>

                                    <div>
                                        <label class="uk-form-label" id="lblUserRole"
                                               for="userRole">
                                            Роль
                                        </label>
                                        <select id="userRole" data-filter name="userRole"
                                                class="uk-form-controls uk-width-small" size="1">
                                            <option value=""></option>
                                            <option value="0">SUPERADMIN</option>
                                            <option value="1">ADMIN</option>
                                            <option value="2">USER</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lblDateUserRegFrom"
                                               for="dateUserRegFrom">
                                            Дата регистрации с
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserRegFrom"/>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lblDateUserRegTo"
                                               for="dateUserRegTo">
                                            Дата регистрации по
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserRegTo"/>
                                    </div>
                                    <div>
                                        <label class="uk-form-label" id="lblUserActiveStatus"
                                               for="userLockStatus">
                                            Статус активации
                                        </label>
                                        <select id="userActiveStatus" data-filter name="userActiveStatus"
                                                class="uk-form-controls uk-width-small" size="1">
                                            <option value=""></option>
                                            <option value="1">Активирован</option>
                                            <option value="2">Не активирован</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="uk-grid uk-grid-small">
                                    <div>
                                        <label class="uk-form-label" id="lblUserLockStatus"
                                               for="userLockStatus">
                                            Статус блокировки
                                        </label>
                                        <select id="userLockStatus" data-filter name="userLockStatus"
                                                class="uk-form-controls uk-width-small" size="1">
                                            <option value=""></option>
                                            <option value="1">Заблокированные</option>
                                            <option value="2">Незаблокированные</option>
                                        </select>
                                    </div>
                                    <div class="date-user-block" style="display:none">
                                        <label class="uk-form-label" id="lblDateUserBlockedFrom"
                                               for="dateUserBlockedFrom">
                                            Дата блокировки с
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserBlockedFrom"/>
                                    </div>
                                    <div class="date-user-block" style="display:none">
                                        <label class="uk-form-label" id="lblDateUserBlockedTo"
                                               for="dateUserBlockedTo">
                                            Дата блокировки по
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserBlockedTo"/>
                                    </div>
                                    <div class="date-user-block" style="display:none">
                                        <label class="uk-form-label" id="lblDateUserUntilBlockedFrom"
                                               for="dateUserUntilBlockedFrom">
                                            Конец блокировки с
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserUntilBlockedFrom"/>
                                    </div>
                                    <div class="date-user-block" style="display:none">
                                        <label class="uk-form-label" id="lblDateUserUntilBlockedTo"
                                               for="dateUserUntilBlockedTo">
                                            Конец блокировки по
                                        </label>
                                        <input type="date" data-filter
                                               class="user-filter-date uk-form-controls uk-width-small"
                                               id="dateUserUntilBlockedTo"/>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="uk-align-center">
                            <div class="uk-flex uk-flex-middle uk-flex-center">
                                <button type="button" id="btnUsersFilterSearch"
                                        class="uk-button-small uk-button-primary uk-margin-right">
                                    Найти
                                </button>
                                <button type="button" id="btnUsersFilterClear"
                                        class="uk-button-small uk-button-primary">
                                    Сбросить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="gridUsers"></div>
            </div>
            <div sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">
                <div>
                    <label class="uk-form-label" id="lblfileUpload"
                           for="fileUpload">
                        Тип загружаемого файла
                    </label>
                    <select id="fileUpload" data-filter name="fileUpload"
                            class="uk-form-controls uk-width-medium  uk-margin-small-bottom" size="1">
                        <option value=""></option>
                        <option value="0">Выгрузка из ФГИС ЛК</option>
                    </select>
                </div>
                <div th:replace="~{upload}"></div>
                <div id="gridUploadedFiles"></div>

            </div>
        </div>
    </div>

    <script sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">
        const cfgGridUsers = {
            autoLoad: true,
            data: {
                dataKey: 'gridUsers',
                url: '/api/apanel/users'
            },
            schema: {
                fields: {
                    id: {
                        type: 'int',
                        editor: {edit: {visible: false}, create: {visible: false}},
                        ui: {label: 'id', grid: {visible: false}}
                    },
                    username: {
                        type: 'text', ui: {label: 'Логин', grid: {visible: true, width: '14%'}},
                        editor: {edit: {readOnly: true}, create: {readOnly: false, required: true}}
                    },
                    email: {
                        type: 'text', ui: {label: 'Email', grid: {visible: true, width: '16%'}},
                        editor: {
                            type: 'email',
                            edit: {readOnly: false, required: true},
                            create: {readOnly: false, required: true}
                        }
                    },
                    phone: {
                        type: 'text', ui: {label: 'Телефон', grid: {visible: true, width: '16%'}},
                        editor: {
                            type: 'phone',
                            edit: {readOnly: false, required: true},
                            create: {readOnly: false, required: true}
                        }
                    },
                    fullName: {
                        type: 'text', ui: {label: 'Полное имя', grid: {visible: true, width: '16%'}},
                        editor: {
                            type: 'text',
                            edit: {readOnly: false, required: true},
                            create: {readOnly: false, required: true}
                        }
                    },
                    password: {
                        role: 'editor',
                        type: 'text',
                        ui: {
                            label: 'Пароль',
                            hint: 'Минимум 8 символов: строчная и заглавная латинские буквы, цифра и спецсимвол'
                        },
                        editor: {
                            type: 'password',
                            showPasswordToggle: true,
                            submit: true,
                            create: {visible: true, required: true},
                            edit: {visible: true},
                            minLength: 8,
                            maxLength: 64,
                            validate: (value, ctx) => {
                                if (!value) return true;
                                const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/;
                                if (!regex.test(value)) {
                                    return "Пароль должен содержать минимум 8 символов, включая заглавную букву, строчную букву, цифру и спецсимвол";
                                }
                                return true;
                            }
                        }
                    },
                    password2: {
                        role: 'editor',
                        confirmOf: 'password',
                        ui: {
                            label: 'Пароль еще раз',
                            hint: 'Повторите сложный пароль полностью'
                        },
                        editor: {
                            type: 'password',
                            showPasswordToggle: true,
                            submit: true,
                            create: {visible: true, required: true},
                            edit: {visible: true}
                        }
                    },
                    role: {
                        type: 'text', values: {
                            enum: [{value: 0, text: 'SUPERADMIN'},
                                {value: 1, text: 'ADMIN'},
                                {value: 2, text: 'USER'}]
                        }, ui: {label: 'Роль', grid: {visible: true, width: '10%'}},
                        editor: {
                            type: 'select',
                            default: 4,
                            edit: {readOnly: false, required: true},
                            create: {readOnly: false, required: true}
                        }
                    },
                    createdAt: {
                        type: 'date', ui: {label: 'Дата рег.', grid: {visible: true, width: '11%', colType: 'date'}},
                        editor: {type: 'date', edit: {visible: false}, create: {visible: false}}
                    },
                    isActive: {
                        type: 'bool',
                        values: {enum: [{value: true, text: 'Активирован'}, {value: false, text: 'Не активирован'}]},
                        ui: {label: 'Активация', grid: {visible: true, width: '8%', colType: 'boolean'}},
                        editor: {type: 'select', edit: {readOnly: false, required: true}, create: {visible: false}}
                    },
                    isLocked: {
                        type: 'bool', values: {enum: [{value: true, text: 'Да'}, {value: false, text: 'Нет'}]},
                        ui: {label: 'Блок.', grid: {visible: true, width: '8%', colType: 'boolean'}},
                        editor: {type: 'select', edit: {readOnly: false, required: true}, create: {visible: false}}
                    },
                    lockedUntil: {
                        type: 'date', ui: {label: 'Блок. по', grid: {visible: true, width: '11%', colType: 'date'}},
                        editor: {type: 'date', edit: {visible: false}, create: {visible: false}}
                    },
                    reasonBlocking: {
                        type: 'text',
                        ui: {label: 'Причина блок.\\разблок.', grid: {visible: true, width: '20%'}},
                        editor: {edit: {readOnly: false, visible: true}, create: {visible: false}}
                    },
                    lockedBy: {
                        type: 'text', ui: {label: 'Заблокировал\\разблокировал', grid: {visible: true, width: '10%'}},
                        editor: {edit: {readOnly: true, visible: true}, create: {visible: false}}
                    },
                    lastLoginAt: {
                        type: 'date',
                        ui: {label: 'Последнее посещение', grid: {visible: true, width: '11%', colType: 'date'}},
                        editor: {type: 'date', edit: {visible: false}, create: {visible: false}}
                    },
                }
            },
            view: {
                checkbox: true,
                columnsResizable: true,
                height: 415,
                tableTitle: {
                    enabled: true,
                    caption: 'Пользователи',
                    hint: 'Пользователи',
                    toggle: false
                },
                toolBar: {
                    add: {caption: 'Добавить', hint: 'Новый пользователь'},
                    edit: {caption: 'Изменить', hint: 'Редактирование пользователя'},
                    del: {caption: 'Удалить', hint: 'Удалить пользователя(пользователей)'}
                },
                pager: {
                    enabled: true,
                    rpp: [10, 20, 50]
                },
                sortOrder: [{field: 'statDate', dir: 'asc'}],
            }
        }
        const gridUsers = new ABGrid("#gridUsers", cfgGridUsers);
    </script>

    <script sec:authorize="hasAnyRole('SUPERADMIN','ADMIN')">

        document.addEventListener('DOMContentLoaded', function () {
            let el = document.getElementById('fileUpload');
            const fileType = ['/api/uploadFromFgislk/import_common_info_csv'];


            function initUpload(url) {

                const uploadContainer = document.querySelector('.js-upload');
                //    Отключаем старый компонент, очищая элемент
                //    Простой способ: заменяем содержимое, чтобы сбросить все обработчики
                uploadContainer.innerHTML = uploadContainer.innerHTML;

                UIkit.upload('.js-upload', {
                    url: url || fileType[el.value] || '',
                    multiple: false,
                    name: 'file',
                    params: {
                        extractZip: true // Явно передаем параметр
                    },
                    credentials: 'include',
                    beforeSend: function () {
                        console.log('beforeSend', arguments);
                    },
                    beforeAll: function () {
                        console.log('beforeAll', arguments);
                    },
                    load: function () {

                    },
                    error: function (env) {
                        let response = JSON.parse(env.xhr.responseText);
                        UIkit.notification({
                            message: '❌ Ошибка загрузки: ' + response.message,
                            status: 'danger',
                            timeout: 3000
                        });

                    },
                    complete: function () {
                        console.log('complete', arguments);
                    },

                    loadStart: function (e) {
                        console.log('loadStart', arguments);

                        bar.removeAttribute('hidden');
                        bar.max = e.total;
                        bar.value = e.loaded;
                    },

                    progress: function (e) {
                        console.log('progress', arguments);

                        bar.max = e.total;
                        bar.value = e.loaded;
                    },

                    loadEnd: function (e) {
                        console.log('loadEnd', arguments);

                        bar.max = e.total;
                        bar.value = e.loaded;
                    },

                    completeAll: function () {
                        console.log('completeAll', arguments);

                        setTimeout(function () {
                            bar.setAttribute('hidden', 'hidden');
                        }, 1000);

                        var response = JSON.parse(arguments[0].response);
                        if (!response.success) {
                            UIkit.notification({
                                message: '❌ Ошибка загрузки: ' + response.message + '<br>' +
                                    'Всего объектов: ' + response.totalPlacemarkCount + '<br>' +
                                    'Загружено: ' + response.importedCount + '<br>' +
                                    'Ошибок: ' + response.errorCount,
                                status: 'danger',
                                timeout: 3000
                            });
                        } else {
                            UIkit.notification({
                                message: response.message,
                                status: 'success',
                                timeout: 3000
                            });
                        }
                    }

                });

            }

            initUpload(fileType[el.value]);

            el.addEventListener('change', function () {
                const type = fileType[el.value];
                if (type) {
                    initUpload(type);
                }
            });
        });

        const cfgUploadedFiles = {
            autoLoad: true,
        //    readOnly: true,
            data: {
                dataKey: 'gridUploadedFiles',
                url: '/api/apanel/userfiles'
            },
            schema: {
                fields: {
                    id: {
                        type: 'int',
                        editor: {edit: {visible: false}, create: {visible: false}},
                        ui: {label: 'id', grid: {visible: false}}
                    },
                    createdAt: {type: 'datetime', ui: {label: 'Загружен', grid: {visible: true, width: '8%'}}},
                    originalName: {type: 'string', ui: {label: 'Ориг. имя', grid: {visible: true, width: '12%'}}},
                    type: {type: 'string', ui: {label: 'Тип', grid: {visible: true, width: '10%'}}},
                    size: {type: 'string', ui: {label: 'Размер, байт', grid: {visible: true, width: '10%'}}},
                    status: {type: 'string', ui: {label: 'Статус', grid: {visible: true, width: '10%'}}},
                    sha256: {type: 'string', ui: {label: 'Контр. сумма', grid: {visible: true, width: '10%'}}},
                    relativePath: {type: 'string', ui: {label: 'Путь', grid: {visible: true, width: '10%'}}},
                    contentType: {type: 'string', ui: {label: 'ContentType', grid: {visible: true, width: '10%'}}},
                    extension: {type: 'string', ui: {label: 'Расширение', grid: {visible: true, width: '10%'}}},
                    errorMessage: {type: 'string', ui: {label: 'Контр. сумма', grid: {visible: true, width: '10%'}}}
                }
            },
            view: {
                checkbox: true,
                columnsResizable: true,
                height: 415,
                tableTitle: {
                    enabled: true,
                    caption: 'Файлы пользователя',
                    hint: 'Файлы пользователя',
                    toggle: false
                },
                toolBar: {
                    bulkGroup: {
                        type: 'group',
                        class: 'abgrid-bulk',
                        bulkOper: {
                            type: 'select',
                            caption: 'Операция',
                            placeholder: '— выберите —',
                            options: [
                                {value: 'doIt', caption: 'Обработать'},
                                {value: 'delete', caption: 'Удалить'},
                            ]
                        },
                        applyBulkOper: {
                            caption: 'Выполнить',
                            requiresSelection: true
                        }
                    },
                },
                pager: {
                    enabled: true,
                    rpp: [10, 20, 50]
                },
                sortOrder: [{field: 'createdAt', dir: 'desc'}]
            }
        }

        const gridUploadedFiles = new ABGrid("#gridUploadedFiles", cfgUploadedFiles);
        gridUploadedFiles.onToolBarClick(async (action, ctx, grid) => {
            if (action !== 'applyBulkOper') return true;
            var opt = {};
            opt.action = 'bulkOper';
            opt.qConfirmEx = 'Вы уверены, что хотите выполнить данную операцию?';
            opt.operName = 'storedFilesBulkOper';
            opt.intent = 'files:';
            opt.data = {};
            opt.data.oper = grid.toolbar.getValue('bulkOper');
            await bulkOperation(action, ctx, grid, opt);
            return false;
        });

    </script>
</div>
</html>
